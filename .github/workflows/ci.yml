name: Sandwichies CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Unit and domain tests
        run: npm test

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore security regression
        run: npm run security:test

      - name: Production build
        run: npm run build

      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/sandwichies-preview.log 2>&1 &

      - name: Entrypoint smoke baseline
        run: |
          sleep 3
          SMOKE_BASE_URL=http://127.0.0.1:4173 npm run smoke
